<title>NavitaEdu Major Finder · مستشار التخصص</title>

<meta property="og:title" content="مستشار التخصص الجامعي | NavitaEdu Major Finder">
<meta property="og:description" content="اعرف معدلك المكافئ والتخصصات اللي يوصلك لها معدلك — جامعة الكويت، جامعة عبدالله السالم، والبعثات الخارجية. Find your equivalent GPA and reachable majors in Kuwait and abroad.">

<meta property="og:locale:alternate" content="en_US">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#203355; --navy-2:#2c4673; --ink:#17212c; --muted:#5b6876; --line:#dfe5ec; --paper:#f2f5f8; --card:#fff;
  --brand:#f14e1c; --brand-soft:#fdece5;
  --ok:#17784a; --ok-bg:#e3f3ea; --mid:#9a6a0c; --mid-bg:#fbf0d7; --no:#a33a3a; --no-bg:#f7e5e5;
  --r:16px; --shadow:0 1px 2px rgba(16,40,68,.05),0 10px 30px rgba(16,40,68,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic","IBM Plex Sans",-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.6}
html[lang=en] body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",-apple-system,"Segoe UI",sans-serif}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:780px;margin:0 auto;padding:16px 14px 120px}
button{font-family:inherit}
[hidden]{display:none!important}

/* Header */
.hero{background:linear-gradient(155deg,var(--navy),var(--navy-2));color:#fff;border-radius:var(--r);padding:20px 20px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset-inline-start:-50px;bottom:-60px;width:180px;height:180px;border:2px solid rgba(241,78,28,.35);border-radius:50%;pointer-events:none}
.hero .brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hero .brand .logo{display:block;height:48px;line-height:0}
.hero .brand .logo svg{height:100%;width:auto}
.lang{margin-inline-start:auto;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;position:relative;z-index:1}
.lang:hover{background:rgba(255,255,255,.2)}
.hero h1{margin:0;font-size:24px;line-height:1.35;font-weight:700}
.hero p{margin:6px 0 0;color:#c9d5e3;font-size:14.5px}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;font-weight:600;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);padding:5px 10px;border-radius:999px}
.badge i{width:7px;height:7px;border-radius:50%;background:#4ade80;display:inline-block;flex:none}

/* Stepper */
.stepper{display:flex;gap:6px;margin:16px 0 4px;padding:0;list-style:none}
.stepper li{flex:1;min-width:0}
.stepper button{width:100%;background:none;border:0;padding:0;cursor:pointer;text-align:start;color:var(--muted)}
.stepper button:disabled{cursor:default}
.stepper .bar{height:5px;border-radius:99px;background:var(--line);margin-bottom:6px;transition:background .25s;display:block}
.stepper .lbl{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.stepper li.done .bar{background:var(--navy)}
.stepper li.cur .bar{background:var(--brand)}
.stepper li.cur .lbl{color:var(--ink)}
.stepper li.done .lbl{color:var(--navy)}

/* Panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-top:14px}
.panel h2{margin:0;font-size:20px;font-weight:700}
.panel .lead{margin:4px 0 18px;color:var(--muted);font-size:14.5px}
.step{display:none}
.step.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field .hint{font-weight:400;color:var(--muted);font-size:12.5px}
.field input,.field select{width:100%;padding:12px 13px;font-size:17px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(241,78,28,.15)}
.field.err input,.field.err select{border-color:var(--no)}
.field .msg{display:none;color:var(--no);font-size:12.5px;margin-top:5px}
.field.err .msg{display:block}
.seg{display:flex;background:var(--paper);border-radius:12px;padding:4px;gap:4px;margin-bottom:8px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button:focus-visible,.chip:focus-visible,.btn:focus-visible,.dest:focus-visible,.pick:focus-visible,.lang:focus-visible{outline:3px solid rgba(241,78,28,.5);outline-offset:2px}

/* Buttons */
.actions{display:flex;gap:10px;margin-top:20px;justify-content:space-between;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.2}
.btn.primary{background:var(--navy);color:#fff;flex:1}
.btn.primary:hover{background:var(--navy-2)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.wa{background:#25d366;color:#08391c;flex:1}
.btn.wa:hover{background:#1fbe5b}
.btn.wa.disabled{opacity:.45;pointer-events:none}

/* Rates */
.eqgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.eq{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fbfcfd;position:relative;overflow:hidden}
.eq:before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--brand)}
.eq.hs:before{background:var(--navy)}
.eq .k{font-size:13.5px;font-weight:700;color:var(--ink)}
.eq .v{font-size:32px;font-weight:700;color:var(--navy);line-height:1.15;margin-top:4px}
.eq .v small{font-size:16px;color:var(--brand)}
.eq .use{font-size:12.5px;color:var(--muted);margin-top:4px}
.eq .warn{font-size:12.5px;font-weight:700;margin-top:4px}
.eq .warn.no{color:var(--no)} .eq .warn.mid{color:var(--mid)}
.official{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink);background:#f1f7f3;border:1px solid #d3eadb;border-radius:12px;padding:11px 13px;margin-top:14px}
.official:before{content:"✓";flex:none;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.note{font-size:13px;color:var(--muted);background:#f7f9fb;border:1px solid var(--line);border-inline-start:3px solid var(--brand);border-radius:10px;padding:10px 12px;margin-top:14px}
.kueq{border:1px dashed var(--line);border-radius:14px;padding:14px}
.kueq .field{max-width:300px}

/* Destination */
.dests{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dest{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:20px 16px;text-align:start;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;color:var(--ink)}
.dest:hover{border-color:var(--navy);transform:translateY(-2px);box-shadow:var(--shadow)}
.dest[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 4px rgba(241,78,28,.15)}
.dest .ic{font-size:30px}
.dest b{display:block;font-size:19px;margin-top:6px}
.dest span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.dest em{display:inline-block;font-style:normal;font-size:12px;font-weight:700;color:var(--navy);background:var(--paper);border-radius:999px;padding:3px 9px;margin-top:10px}

/* Filters */
.flabel{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 8px}
.flabel:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .c{font-size:12px;opacity:.7;margin-inline-start:6px}
.search{width:100%;padding:11px 13px;font-size:15px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;margin-top:12px}
.search:focus{outline:none;border-color:var(--brand)}
.compare{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--brand-soft);border-radius:12px;padding:10px 14px;margin-top:16px;font-size:14px}
.compare b.big{color:var(--navy);font-size:18px}
.compare .sm{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}

/* Result cards */
.list{display:grid;gap:10px;margin-top:14px}
.card{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff;transition:border-color .15s}
.card.sel{border-color:var(--brand);background:#fffaf6}
.card .t{font-weight:700;font-size:15.5px;line-height:1.4}
.card .s{font-size:13px;color:var(--muted)}
.card .nums{grid-column:1/-1;display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.card .nums b{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.mid{color:var(--mid);background:var(--mid-bg)} .pill.no{color:var(--no);background:var(--no-bg)} .pill.na{color:var(--muted);background:var(--paper)}
.gap.ok{color:var(--ok)} .gap.mid{color:var(--mid)} .gap.no{color:var(--no)}
.pick{margin-inline-start:auto;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer}
.pick[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.empty{text-align:center;color:var(--muted);padding:28px 10px;border:1.5px dashed var(--line);border-radius:14px;margin-top:14px}
.endbox{margin-top:18px;border-radius:14px;background:var(--paper);padding:16px}
.endbox p{margin:0 0 12px;font-size:14px;color:var(--ink)}

/* Flags */
.flag{display:inline-block;width:21px;height:14px;border-radius:3px;overflow:hidden;vertical-align:-2px;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none;margin-inline-end:6px;line-height:0}
.flag svg{width:100%;height:100%;display:block}
.dest .ic .flag{width:42px;height:28px;border-radius:5px;margin:0}
.chip[aria-pressed="true"] .flag{box-shadow:0 0 0 1px rgba(255,255,255,.5)}

/* Sticky tray */
.tray{position:fixed;inset-inline:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:none}
.tray.on{display:block}
.tray .in{max-width:780px;margin:0 auto;display:flex;gap:12px;align-items:center}
.tray .info{flex:1;font-size:14px;color:var(--muted)}
.tray .info b{color:var(--ink);font-size:16px}

/* Summary */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sum div{background:var(--paper);border-radius:12px;padding:10px 12px}
.sum span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.sum b{font-size:16px}
.picked{display:grid;gap:8px;margin-top:4px}
.picked .row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.picked .row .x{margin-inline-start:auto;border:0;background:var(--paper);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--muted);font-size:16px;flex:none}
.preview{white-space:pre-wrap;background:#e9f7ee;border:1px solid #cfead9;border-radius:14px;padding:14px;font-size:14px;line-height:1.75;margin-top:6px}
.copied{font-size:13px;color:var(--ok);font-weight:600;min-height:20px;margin-top:6px}

footer{margin-top:22px;font-size:12.5px;color:var(--muted);line-height:1.8}
footer b{color:var(--ink)}
footer a{color:var(--navy)}

@media (max-width:600px){
  .grid2,.eqgrid,.dests{grid-template-columns:1fr}
  .sum{grid-template-columns:1fr 1fr}
  .hero h1{font-size:21px}
  .stepper .lbl{font-size:11px}
  .eq .v{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function kwName(k){return KW[k].n[LANG==="en"?1:0]}
function kuKey(r){ var c=r[0].split(" / ")[0];

/* ---------- helpers ---------- */
function f2(n){return (Math.round(n*100)/100).toFixed(2)}
function fx(n){return String(+n)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function num(v){var n=parseFloat(v);return isFinite(n)?n:NaN}
function inRange(n,a,b){return isFinite(n)&&n>=a&&n<=b}
function pct(v){return '<span class="num">'+f2(v)+'%</span>'}
function catOf(r){ if(r[3]==="H")return "oth"; var m=r[1];
  if(m==="طب بشري")return "med"; if(m==="طب أسنان")return "dent"; if(m.indexOf("صيدلة")>-1)return "phar"; if(m==="طب بيطري")return "vet"; return "eng"; }
function english(){
  if(S.engMode==="pct"){var v=num($("eng").value);return inRange(v,0,100)?{score:v,label:f2(v)+"%"}:null}
  if(S.engMode==="ielts"){var b=num($("engSel").value);return isFinite(b)?{score:IELTS[b],label:"IELTS "+b+" ("+IELTS[b]+"%)"}:null}
  var x=num($("eng").value); if(!inRange(x,0,120))return null;
  var row=TOEFL.filter(function(r){return Math.floor(x)>=r[0]&&Math.floor(x)<=r[1]})[0];
  return {score:IELTS[row[2]],label:"TOEFL "+x+" ("+IELTS[row[2]]+"%)"};
}
function scores(){ return {hs:num($("hs").value),math:num($("math").value),e:english(),ar:num($("ar").value)} }
function eqv(w,s){ if(w==="hs")return s.hs; var x=W[w]; return x.hs*s.hs+x.eng*s.e.score+x.math*s.math; }
function kuRate(k,s){ var w=KW[k]; if(w.ar&&!isFinite(s.ar))return NaN; return w.hs*s.hs+w.en*s.e.score+w.m*s.math+(w.ar?w.ar*s.ar:0); }
function kuGate(k,s){ var w=KW[k]; if(w.minHs&&s.hs<w.minHs)return t("gateHs",{n:w.minHs}); if(w.minEn&&s.e.score<w.minEn)return t("gateEn",{n:w.minEn}); return ""; }
function status(v,c){ if(!isFinite(v))return {cls:"na",txt:t("st_na")}; if(v>=c)return {cls:"ok",txt:t("st_ok")}; if(v>=c-MARGIN)return {cls:"mid",txt:t("st_mid")}; return {cls:"no",txt:t("st_no")}; }
function rowStatus(r){ return r.gate?{cls:"no",txt:t("notElig")}:r.needAr?{cls:"na",txt:t("needAr")}:status(r.you,r.cut); }
function gapTxt(v,c){ if(!isFinite(v))return ""; var d=v-c; return (d>=0?t("above"):t("short"))+" "+pct(Math.abs(d)); }

}

/* ---------- stepper & navigation ---------- */
function stepCount(){ return S.path==="kw"?4:5; }
function drawStepper(){
  var labels=t("steps").slice(0,stepCount());
  $("stepper").innerHTML=labels.map(function(x,i){var n=i+1,cls=n<S.step?"done":n===S.step?"cur":"";
    return '<li class="'+cls+'"><button type="button" data-go="'+n+'" '+(n>S.maxStep?"disabled":"")+' aria-current="'+(n===S.step?"step":"false")+'"><span class="bar"></span><span class="lbl">'+n+'. '+x+'</span></button></li>'}).join("");
}
function go(n){
  if(n>S.maxStep||n>stepCount())return;
  S.step=n; document.querySelectorAll(".step").forEach(function(el){el.classList.toggle("on",+el.dataset.step===n)});
  if(n>=4)refreshPicks();
  drawStepper();
  if(n===3)drawEq(); if(n===4)drawOptions(); if(n===5)drawSummary();
  $("tray").classList.toggle("on",n===4&&S.path==="ab");
  updateTray();
  window.scrollTo({top:0,behavior:"smooth"}); postHeight();
}
function unlock(n){ if(n>S.maxStep)S.maxStep=n; go(n); }

/* ---------- step 1 ---------- */
function validate1(){

}

function abroadRows(cat){

    var c=CATS.filter(function(x){return x.id===cat})[0];
    return {key:"ab|"+r[0]+"|"+r[1],path:"ab",country:r[0],ar:r[1],cut:r[2],type:r[3],cat:c,you:eqv(c.w,s),est:!!c.est,gate:"",needAr:false};
  });
}
function kuwaitRows(){
  var s=scores(), rows=[];

    rows.push({key:"ku|"+r[1]+"|"+r[4],path:"kw",uni:"ku",college:p[0],ar:p.slice(1).join(" / "),code:r[1],cut:r[2],type:r[3],

    rows.push({key:"aasu|"+r[0]+"|"+r[2],path:"kw",uni:"aasu",college:"",ar:r[0],sec:r[2],cut:r[1],type:"E",wk:k,you:kuRate(k,s),gate:"",needAr:false,est:true,mmi:r[0]==="دكتور في الطب"}); });

/* display text for a row in the current language */
function rowTitleHtml(r){ return r.path==="ab"?flag(r.country)+esc(ctry(r.country)):esc(rowTitle(r)); }

}
function rowSub(r){
  if(r.path==="ab")return nm(r.ar)+(r.type==="H"?" · "+t("hsBased"):"")+(r.est?" · "+t("est"):"");
  if(r.uni==="ku")return t("ku")+" · "+nm(r.college)+" · "+t("code")+" "+r.code+(r.type==="H"?" · "+t("hsBased"):"");

    rows=S.uni==="all"?all:all.filter(function(r){return r.uni===S.uni});
    if(S.uni==="ku"){
      var col=countBy(rows,function(r){return r.college});
      if(S.college!=="all"&&!col[S.college])S.college="all";
      html+='<div class="flabel">'+t("fCollege")+'</div><div class="chips">'+chip("college","all",t("allColleges"),S.college==="all")+Object.keys(col).map(function(k){return chip("college",k,nm(k),S.college===k,col[k])}).join("")+'</div>';
      if(S.college!=="all")rows=rows.filter(function(r){return r.college===S.college});
    }
    html+='<input class="search" id="q" type="search" placeholder="'+esc(t("search"))+'" value="'+esc(S.q)+'">';
    $("compare").innerHTML='<span>'+t("cmpKw")+'<br><span class="sm">'+t("track")+': '+t(S.track)+' · '+t("arabic")+': '+(isFinite(s.ar)?pct(s.ar):t("notEntered"))+'</span></span>'+
      (isFinite(s.ar)?"":'<button class="chip" id="addAr" type="button">'+t("addAr")+'</button>');
  }
  if(S.q){var q=S.q.trim().toLowerCase(); rows=rows.filter(function(r){return (rowTitle(r)+" "+rowSub(r)+" "+r.ar).toLowerCase().indexOf(q)>-1})}
  var byStatus=S.path==="ab"&&["med","dent","phar"].indexOf(S.cat)>-1, RANK={ok:0,mid:1,no:2,na:3};
  /* Medicine, Dentistry, Pharmacy: smallest gap first ("short by" least to most); others: highest cutoff first */
  rows.sort(function(a,b){ return byStatus ? (RANK[rowStatus(a).cls]-RANK[rowStatus(b).cls]) || ((a.cut-a.you)-(b.cut-b.you)) : b.cut-a.cut; });
  if(S.path==="ab")$("lead4").textContent=byStatus?t("lead4AbStatus"):t("lead4Ab");
  var focus=document.activeElement&&document.activeElement.id==="q", caret=focus?document.activeElement.selectionStart:0;
  $("filters").innerHTML=html;
  $("list").innerHTML=rows.length?rows.map(cardHtml).join(""):'<div class="empty">'+t("empty")+'</div>';
  if(focus&&$("q")){$("q").focus();try{$("q").setSelectionRange(caret,caret)}catch(e){}}
  postHeight();
}
function cardHtml(r){
  var st=rowStatus(r), on=S.picks.some(function(p){return p.key===r.key}), canPick=r.path==="ab";
  return '<div class="card'+(on?" sel":"")+'"><div><div class="t">'+rowTitleHtml(r)+'</div><div class="s">'+esc(rowSub(r))+'</div></div><span class="pill '+st.cls+'">'+st.txt+'</span>'+
    '<div class="nums"><span>'+t("lowest")+' <b class="num">'+fx(r.cut)+'%</b></span><span>'+(r.type==="H"?t("yourHs"):t("yourRate"))+' <b>'+(isFinite(r.you)?pct(r.you):"—")+'</b></span><span class="gap '+st.cls+'">'+(r.gate?esc(r.gate):gapTxt(r.you,r.cut))+'</span>'+
    (canPick?'<button type="button" class="pick" data-key="'+esc(r.key)+'" aria-pressed="'+on+'">'+(on?t("added"):t("add"))+'</button>':"")+'</div></div>';
}
function allAbroadRows(){ var out=[]; CATS.forEach(function(c){out=out.concat(abroadRows(c.id))}); return out; }
function rowByKey(k){ return allAbroadRows().filter(function(r){return r.key===k})[0]; }
function refreshPicks(){ S.picks=S.picks.map(function(p){return rowByKey(p.key)}).filter(Boolean); }
function togglePick(k){
  var i=S.picks.map(function(p){return p.key}).indexOf(k);
  if(i>-1)S.picks.splice(i,1); else { var r=rowByKey(k); if(r)S.picks.push(r); }
  drawOptions(); updateTray();
}
function updateTray(){ var n=S.picks.length; $("trayInfo").innerHTML=n?t("trayN",{n:"<b>"+n+"</b>"}):t("trayNone"); }

/* ---------- step 5 (abroad only) ---------- */
function drawSummary(){
  var s=scores();
  $("sum").innerHTML=[[t("sumHs"),pct(s.hs)],[t("sumMath"),pct(s.math)],[t("sumEng"),'<span class="num">'+esc(s.e.label)+'</span>'],[t("sumDest"),esc(t("abT"))]]
    .map(function(x){return '<div><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join("");
  drawPicked();
  var names={}; MOHE.forEach(function(r){names[nm(r[1])]=1});
  $("majorsList").innerHTML=Object.keys(names).map(function(n){return '<option value="'+esc(n)+'">'}).join("");
  var iv=$("interest").value;
  if((!iv||iv===S.autoVal)&&S.picks.length){S.autoVal=nm(S.picks[0].ar);$("interest").value=S.autoVal;}
  updateMessage();
}
function drawPicked(){
  $("picked").innerHTML=S.picks.length?S.picks.map(function(p,i){var st=rowStatus(p);
    return '<div class="row"><span class="pill '+st.cls+'">'+st.txt+'</span><div><b>'+esc(nm(p.ar))+'</b><div style="font-size:12.5px;color:var(--muted)">'+rowTitleHtml(p)+' · '+t("lowest")+' <span class="num">'+fx(p.cut)+'%</span></div></div><button class="x" data-rm="'+i+'" aria-label="×">×</button></div>'}).join("")
    :'<div class="empty" style="margin-top:0">'+t("noPicks")+'</div>';
}
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i})}
function buildMessage(){
  var s=scores(), L=[];
  L.push(t("waHello"));
  var who=$("name").value.trim(); if(who)L.push(t("waName")+": "+who);
  L.push("");
  L.push("• "+t("waHs")+": "+f2(s.hs)+"% ("+t(S.track)+")");
  L.push("• "+t("waMath")+": "+f2(s.math)+"%");
  L.push("• "+t("waEng")+": "+s.e.label);
  L.push("• "+t("waDest")+": "+t("abT"));
  L.push("• "+t("waCat")+": "+(S.picks.length?uniq(S.picks.map(function(p){return catName(p.cat)})).join("، "):catName(CATS.filter(function(c){return c.id===S.cat})[0])));
  if(S.picks.length){
    L.push("• "+t("waPicks")+":");
    S.picks.forEach(function(p,i){
      L.push("   "+(i+1)+") "+nm(p.ar)+" — "+FLAGS[p.country]+" "+ctry(p.country)+" ("+t("waLowest")+" "+fx(p.cut)+"% · "+(p.type==="H"?t("waMineHs"):p.est?t("waMineEst"):t("waMine"))+" "+f2(p.you)+"%)");
    });
  }
  L.push("• "+t("waInterest")+": "+($("interest").value.trim()||t("waUndecided")));
  return L.join("\n");
}
function updateMessage(){
  var m=buildMessage(); $("preview").textContent=m;
  $("waBtn").href="https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(m);
}

/* ---------- events ---------- */
function restart(){S.picks=[];S.path=null;S.maxStep=1;S.uni="all";S.college="all";S.cat="med";S.country="all";S.q="";
  ["hs","math","eng","ar","interest","name"].forEach(function(id){$(id).value=""});$("engSel").value="";
  document.querySelectorAll(".dest").forEach(function(d){d.setAttribute("aria-pressed","false")});go(1);}
function choosePath(p){
  S.path=p; S.q=""; document.querySelectorAll(".dest").forEach(function(d){d.setAttribute("aria-pressed",d.dataset.path===p)});
  if(p!=="ab")S.picks=[]; S.maxStep=3; unlock(3);
}
document.addEventListener("click",function(ev){
  var b=ev.target.closest("button,a"); if(!b)return;
  if(b.id==="langBtn"){LANG=LANG==="ar"?"en":"ar";applyLang();track("language_switch");return}
  if(b.dataset.go){go(+b.dataset.go);return}
  if(b.hasAttribute("data-back")){go(S.step-1);return}
  if(b.hasAttribute("data-restart")){restart();return}
  if(b.closest("#track")){S.track=b.dataset.v;segSet("track",S.track);return}
  if(b.closest("#engMode")){setEngMode(b.dataset.v);$("f-eng").classList.remove("err");return}
  if(b.dataset.path){choosePath(b.dataset.path);track(b.dataset.path==="kw"?"destination_kuwait":"destination_abroad");return}
  if(b.id==="switchAb"){choosePath("ab");track("destination_abroad",{from:"kuwait_results"});return}
  if(b.dataset.g){var g=b.dataset.g; S[g]=b.dataset.v; if(g==="cat")track("category_view",{category:b.dataset.v}); if(g==="country"&&b.dataset.v!=="all")track("country_view",{country:b.dataset.v,category:S.cat}); if(g==="uni"&&b.dataset.v!=="all")track("university_view",{university:b.dataset.v}); if(g==="cat"){S.country="all";S.q=""} if(g==="uni"){S.college="all"} drawOptions(); return}
  if(b.dataset.key){var adding=!S.picks.some(function(p){return p.key===b.dataset.key}); togglePick(b.dataset.key); if(adding){var pr=rowByKey(b.dataset.key); track("option_added",{category:pr.cat.id,country:pr.country});} return}
  if(b.dataset.rm!=null){S.picks.splice(+b.dataset.rm,1);drawPicked();updateMessage();return}
  if(b.id==="addAr"){go(3);setTimeout(function(){$("ar").focus()},300);return}
});
$("go2").addEventListener("click",function(){ if(validate1()){unlock(2);track("scores_submitted",{track:S.track,english_type:S.engMode});} else { var e=document.querySelector(".field.err input:not([hidden]),.field.err select:not([hidden])"); if(e)e.focus(); } });
$("go4").addEventListener("click",function(){ var k=num($("ar").value); var bad=S.path==="kw"&&$("ar").value!==""&&!inRange(k,0,100); $("f-ar").classList.toggle("err",bad); if(!bad)unlock(4); else $("ar").focus(); });
$("go5").addEventListener("click",function(){ if(S.path==="ab"){unlock(5);track("apply_step",{options_picked:S.picks.length});} });
$("waBtn").addEventListener("click",function(){ track("whatsapp_click",{options_picked:S.picks.length,categories:uniq(S.picks.map(function(p){return p.cat.id})).join(",")||S.cat,major_entered:!!$("interest").value.trim()}); });
["hs","math","eng","engSel"].forEach(function(id){$(id).addEventListener("input",function(){$(id).closest(".field").classList.remove("err"); if(S.maxStep>1){S.maxStep=1;drawStepper()}})});
$("ar").addEventListener("input",function(){$("f-ar").classList.remove("err"); if(S.maxStep>3)S.maxStep=3; drawStepper(); drawEq();});
$("filters").addEventListener("input",function(e){if(e.target.id==="q"){S.q=e.target.value;drawOptions()}});
["interest","name"].forEach(function(id){$(id).addEventListener("input",updateMessage)});
$("copyBtn").addEventListener("click",function(){
  var m=buildMessage();
  try{navigator.clipboard.writeText(m).then(function(){$("copied").textContent=t("copied")},function(){$("copied").textContent=t("copyFail")})}
  catch(e){$("copied").textContent=t("copyFail")}
});

/* iframe auto-resize (keeps the current site's embed working) */
function postHeight(){ if(window.parent===window)return; window.parent.postMessage({type:"navita-calc-height",height:document.documentElement.scrollHeight},"*"); }
if(window.ResizeObserver)new ResizeObserver(postHeight).observe(document.body);

applyLang();
</script>
</body>
